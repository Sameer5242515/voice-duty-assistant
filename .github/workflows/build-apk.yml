
name: Build Voice Duty Assistant APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoiceDutyAssistantAndroidProject.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          unzip -o VoiceDutyAssistantAndroidProject.zip -d source

      - name: Download Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip

      - name: Build APK
        run: ./gradle-8.9/bin/gradle -p source assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: VoiceDutyAssistant-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
